version: 1
description: >
  Approved or review-eligible source registry for the Fire Alarm RoomPlan ML workspace.
  Internet collection is bootstrap-only. Inclusion here does not automatically approve every
  asset for training. Each asset still requires provenance capture and review.

policy_defaults:
  bootstrap_scraping_only: true
  require_asset_level_review: true
  unclear_license_action: blocked
  default_asset_status: allowed_review_only
  prohibited_without_explicit_review:
    - training_use
    - redistribution
    - public_demo_packaging

required_metadata_fields:
  - domain
  - source_type
  - robots_status
  - copyright_note
  - terms_reviewed_by
  - training_approval
  - rate_limit_policy
  - notes

sources:
  - id: apollo-fire
    name: Apollo Fire Detectors
    domain: apollo-fire.co.uk
    source_type: manufacturer_product_pages
    status: allowed_review_only
    robots_status: must_check_before_crawl
    training_approval: pending_asset_review
    rate_limit_policy: conservative_manual_or_low_rate_only
    copyright_note: Manufacturer-owned product imagery and literature; do not assume training rights.
    terms_reviewed_by: pending
    notes: >
      Priority manufacturer from roomplan.md shortlist. Product pages and brochures may help weak
      labeling and review, but every asset requires explicit approval before training use.

  - id: hochiki-europe
