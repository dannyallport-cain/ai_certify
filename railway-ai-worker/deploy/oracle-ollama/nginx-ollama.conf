server {
    listen 80;
    listen [::]:80;
    server_name your-ollama-host.example.com;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-ollama-host.example.com;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/your-ollama-host.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-ollama-host.example.com/privkey.pem;

    # Optional hardening examples:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # allow 203.0.113.10;
    # deny all;

    # Optional basic auth:
    # auth_basic "Restricted";
    # auth_basic_user_file /opt/ollama/nginx-auth/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}