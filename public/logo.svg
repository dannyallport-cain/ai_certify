<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="112" fill="url(#grad-main)" />

  <g filter="url(#shadow)">
    <!-- Certificate Sheet -->
    <rect x="136" y="112" width="240" height="312" rx="12" fill="#ffffff" />
    
    <!-- Checklist/Certificate markings -->
    <rect x="176" y="152" width="50" height="8" rx="4" fill="#e2e8f0" />
    <rect x="236" y="152" width="100" height="8" rx="4" fill="#f1f5f9" />
    
    <rect x="176" y="176" width="160" height="8" rx="4" fill="#f1f5f9" />
    <rect x="176" y="200" width="160" height="8" rx="4" fill="#f1f5f9" />
    
    <!-- Divider -->
    <rect x="176" y="228" width="160" height="2" rx="1" fill="#f1f5f9" />

    <!-- AI/Neural Core Circle -->
    <circle cx="256" cy="300" r="60" fill="url(#grad-shield)" />
    
    <!-- Shield/Checkmark Icon inside Core -->
    <path d="M256 270 L280 285 L280 310 L256 325 L232 310 L232 285 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M245 300 L253 308 L270 291" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pulse Rings (Subtle AI activity) -->
    <circle cx="256" cy="300" r="75" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />
    <circle cx="256" cy="300" r="90" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" />
  </g>
</svg>